[package]
name = "flippy"
version = "0.4.4"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.6.0", features = ["cargo", "derive"] }
flipper-rpc = { version = "0.9.5", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.9.8"
url = "2.5.8"

[dev-dependencies]
tempfile = "3.23.0"

[patch.crates-io]
flipper-rpc = { path = "../flipper-rpc" }
